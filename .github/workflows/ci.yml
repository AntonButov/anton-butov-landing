name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Gradle Check
      run: ./gradlew check
      
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          composeApp/build/reports/
          build/reports/
        retention-days: 30

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build for production
      run: ./gradlew wasmJsBrowserDistribution
      
    # Copy only hashed WASM files (no static duplicates) and create gzip versions
    - name: Prepare publish directory (copy hashed WASM files, CNAME, .nojekyll)
      run: |
        PUBLISH_DIR=composeApp/build/dist/wasmJs/productionExecutable
        mkdir -p "$PUBLISH_DIR"
        
        echo "Looking for WASM files in build/js/packages/composeApp/kotlin/"
        ls -la build/js/packages/composeApp/kotlin/*.wasm || echo "No WASM files found in kotlin dir"
        
        # Copy all WASM files with their original hash names (no renaming)
        echo "Copying WASM files with hash names..."
        find build/js/packages/composeApp/kotlin/ -name "*.wasm" -type f -exec cp -v {} "$PUBLISH_DIR/" \;
        
        # Create gzipped versions for all WASM files
        echo "Creating gzipped versions..."
        for wasm_file in "$PUBLISH_DIR"/*.wasm; do
          if [ -f "$wasm_file" ]; then
            gzip -9 -c "$wasm_file" > "${wasm_file}.gz"
            echo "Created compressed version: $(basename "${wasm_file}.gz") ($(du -h "${wasm_file}.gz" | cut -f1))"
          fi
        done
        
        # Remove any static WASM files to prevent duplication
        echo "Removing static WASM files to prevent duplication..."
        rm -f "$PUBLISH_DIR/composeApp.wasm" "$PUBLISH_DIR/skiko.wasm"
        rm -f "$PUBLISH_DIR/composeApp.wasm.gz" "$PUBLISH_DIR/skiko.wasm.gz"
        
        # service files
        if [ -f CNAME ]; then
          cp -v CNAME "$PUBLISH_DIR"/
        fi
        touch "$PUBLISH_DIR/.nojekyll"
        
        echo "Final WASM files in publish directory:"
        ls -la "$PUBLISH_DIR"/*.wasm* || echo "No WASM files found"
      
    - name: Deploy to GitHub Pages
      id: deployment
      uses: peaceiris/actions-gh-pages@v4.0.0
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./composeApp/build/dist/wasmJs/productionExecutable
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'