name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Gradle Check
      run: ./gradlew check
      
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          composeApp/build/reports/
          build/reports/
        retention-days: 30

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Deploy on:
    #  - direct pushes to master
    #  - merged pull requests with base branch master
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build for production
      run: ./gradlew wasmJsBrowserDistribution

    # Ensure WASM artifacts and service files are present in the publish directory
    - name: Prepare publish directory (copy WASM, CNAME, .nojekyll)
      run: |
        PUBLISH_DIR=composeApp/build/dist/wasmJs/productionExecutable
        mkdir -p "$PUBLISH_DIR"
        # copy wasm artifacts produced under build/js/packages
        if [ -f build/js/packages/composeApp/kotlin/composeApp.wasm ]; then
          cp -v build/js/packages/composeApp/kotlin/composeApp.wasm "$PUBLISH_DIR"/
        fi
        if [ -f build/js/packages/composeApp/kotlin/skiko.wasm ]; then
          cp -v build/js/packages/composeApp/kotlin/skiko.wasm "$PUBLISH_DIR"/
        fi
        # service files
        if [ -f CNAME ]; then
          cp -v CNAME "$PUBLISH_DIR"/
        fi
        touch "$PUBLISH_DIR/.nojekyll"
      
    - name: Deploy to GitHub Pages
      id: deployment
      uses: peaceiris/actions-gh-pages@v4.0.0
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./composeApp/build/dist/wasmJs/productionExecutable
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'