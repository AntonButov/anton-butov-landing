name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Gradle Check
      run: ./gradlew check
      
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          composeApp/build/reports/
          build/reports/
        retention-days: 30

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Deploy only on master branch
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build for production
      run: ./gradlew wasmJsBrowserDistribution

    # Copy files to publish directory (files already have stable names)
    - name: Prepare publish directory
      run: |
        PUBLISH_DIR=composeApp/build/dist/wasmJs/productionExecutable
        mkdir -p "$PUBLISH_DIR"
        
        echo "Copying built files to publish directory..."
        
        # Copy the main WASM file (now named app.wasm)
        if [ -f "build/js/packages/composeApp/kotlin/app.wasm" ]; then
          cp -v "build/js/packages/composeApp/kotlin/app.wasm" "$PUBLISH_DIR/"
          echo "Copied app.wasm"
        else
          echo "app.wasm not found, looking for any .wasm file..."
          WASM_FILE=$(find build/js/packages/composeApp/kotlin/ -name "*.wasm" -type f | head -1)
          if [ -n "$WASM_FILE" ]; then
            cp -v "$WASM_FILE" "$PUBLISH_DIR/app.wasm"
            echo "Renamed $(basename "$WASM_FILE") -> app.wasm"
          fi
        fi
        
        # Copy the main JS file (now named app.mjs)
        if [ -f "build/js/packages/composeApp/kotlin/app.mjs" ]; then
          cp -v "build/js/packages/composeApp/kotlin/app.mjs" "$PUBLISH_DIR/"
          echo "Copied app.mjs"
        else
          echo "app.mjs not found, looking for any .mjs file..."
          MJS_FILE=$(find build/js/packages/composeApp/kotlin/ -name "*.mjs" -type f | head -1)
          if [ -n "$MJS_FILE" ]; then
            cp -v "$MJS_FILE" "$PUBLISH_DIR/app.mjs"
            echo "Renamed $(basename "$MJS_FILE") -> app.mjs"
          fi
        fi
        
        # Create gzipped versions
        echo "Creating gzipped versions..."
        for file in "$PUBLISH_DIR"/app.wasm "$PUBLISH_DIR"/app.mjs; do
          if [ -f "$file" ]; then
            gzip -9 -c "$file" > "${file}.gz"
            echo "Created compressed version: $(basename "${file}.gz") ($(du -h "${file}.gz" | cut -f1))"
          fi
        done
        
        echo "Files copied successfully with stable names!"
        
        # Copy favicon and other static resources
        echo "Copying favicon and static resources..."
        cp -v composeApp/src/wasmJsMain/resources/favicon*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No favicon files found"
        cp -v composeApp/src/wasmJsMain/resources/apple-touch-icon.png "$PUBLISH_DIR/" 2>/dev/null || echo "No apple-touch-icon found"
        cp -v composeApp/src/wasmJsMain/resources/android-chrome-*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No android-chrome icons found"
        cp -v composeApp/src/wasmJsMain/resources/site.webmanifest "$PUBLISH_DIR/" 2>/dev/null || echo "No webmanifest found"
        
        # Copy images as-is (AsyncImage handles optimization)
        echo "Copying images for async loading..."
        cp -v composeApp/src/wasmJsMain/resources/*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No PNG images found"
        cp -v composeApp/src/wasmJsMain/resources/*.svg "$PUBLISH_DIR/" 2>/dev/null || echo "No SVG images found"
        
        # service files
        if [ -f CNAME ]; then
          cp -v CNAME "$PUBLISH_DIR"/
        fi
        touch "$PUBLISH_DIR/.nojekyll"
        
        echo "Final WASM files in publish directory:"
        ls -la "$PUBLISH_DIR"/*.wasm* || echo "No WASM files found"
    - name: Deploy to GitHub Pages
      id: deployment
      uses: peaceiris/actions-gh-pages@v4.0.0
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./composeApp/build/dist/wasmJs/productionExecutable
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'