name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Gradle Check
      run: ./gradlew check
      
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          composeApp/build/reports/
          build/reports/
        retention-days: 30

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Deploy only on master branch
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build for production
      run: ./gradlew wasmJsBrowserDistribution

    # Copy WASM files with hash names and generate dynamic preload links
    - name: Prepare publish directory (copy hashed WASM files, generate dynamic preload)
      run: |
        PUBLISH_DIR=composeApp/build/dist/wasmJs/productionExecutable
        mkdir -p "$PUBLISH_DIR"
        
        echo "Looking for WASM files in build/js/packages/composeApp/kotlin/"
        ls -la build/js/packages/composeApp/kotlin/*.wasm || echo "No WASM files found in kotlin dir"
        
        # Copy all WASM files with their original hash names
        echo "Copying WASM files with hash names..."
        find build/js/packages/composeApp/kotlin/ -name "*.wasm" -type f -exec cp -v {} "$PUBLISH_DIR/" \;
        
        # Copy favicon and other static resources
        echo "Copying favicon and static resources..."
        cp -v composeApp/src/wasmJsMain/resources/favicon*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No favicon files found"
        cp -v composeApp/src/wasmJsMain/resources/apple-touch-icon.png "$PUBLISH_DIR/" 2>/dev/null || echo "No apple-touch-icon found"
        cp -v composeApp/src/wasmJsMain/resources/android-chrome-*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No android-chrome icons found"
        cp -v composeApp/src/wasmJsMain/resources/site.webmanifest "$PUBLISH_DIR/" 2>/dev/null || echo "No webmanifest found"
        
        # Create gzipped versions for all WASM files
        echo "Creating gzipped versions..."
        for wasm_file in "$PUBLISH_DIR"/*.wasm; do
          if [ -f "$wasm_file" ]; then
            gzip -9 -c "$wasm_file" > "${wasm_file}.gz"
            echo "Created compressed version: $(basename "${wasm_file}.gz") ($(du -h "${wasm_file}.gz" | cut -f1))"
          fi
        done
        
        # Generate dynamic preload links in index.html
        echo "Generating dynamic preload links..."
        if [ -f "$PUBLISH_DIR/index.html" ]; then
          # Find all WASM files and create preload links
          PRELOAD_LINKS=""
          for wasm_file in "$PUBLISH_DIR"/*.wasm; do
            if [ -f "$wasm_file" ]; then
              filename=$(basename "$wasm_file")
              PRELOAD_LINKS="${PRELOAD_LINKS}
    <link rel=\"preload\" href=\"${filename}\" as=\"fetch\" type=\"application/wasm\" crossorigin>"
            fi
          done
          
          # Insert preload links before the closing </head> tag
          sed -i "s|</head>|${PRELOAD_LINKS}
</head>|" "$PUBLISH_DIR/index.html"
          echo "Added dynamic preload links to index.html"
        fi
        
        # service files
        if [ -f CNAME ]; then
          cp -v CNAME "$PUBLISH_DIR"/
        fi
        touch "$PUBLISH_DIR/.nojekyll"
        
        echo "Final WASM files in publish directory:"
        ls -la "$PUBLISH_DIR"/*.wasm* || echo "No WASM files found"
      
    - name: Deploy to GitHub Pages
      id: deployment
      uses: peaceiris/actions-gh-pages@v4.0.0
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./composeApp/build/dist/wasmJs/productionExecutable
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'