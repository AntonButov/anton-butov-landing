name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Gradle Check
      run: ./gradlew check
      
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          composeApp/build/reports/
          build/reports/
        retention-days: 30

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Deploy only on master branch
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build for production
      run: ./gradlew wasmJsBrowserDistribution

    # Rename WASM files to static names and update references
    - name: Prepare publish directory (rename WASM files to static names)
      run: |
        PUBLISH_DIR=composeApp/build/dist/wasmJs/productionExecutable
        mkdir -p "$PUBLISH_DIR"
        
        echo "Looking for WASM files in build/js/packages/composeApp/kotlin/"
        ls -la build/js/packages/composeApp/kotlin/*.wasm || echo "No WASM files found in kotlin dir"
        
        # Find and rename WASM files to static names
        echo "Renaming WASM files to static names..."
        
        # Find the largest WASM file (usually composeApp.wasm) and rename to composeApp.wasm
        LARGEST_WASM=$(find build/js/packages/composeApp/kotlin/ -name "*.wasm" -type f -exec ls -la {} \; | sort -k5 -nr | head -1 | awk '{print $NF}')
        if [ -n "$LARGEST_WASM" ]; then
          cp -v "$LARGEST_WASM" "$PUBLISH_DIR/composeApp.wasm"
          echo "Renamed $(basename "$LARGEST_WASM") -> composeApp.wasm"
        fi
        
        # Find the second largest WASM file (usually skiko.wasm) and rename to skiko.wasm
        SECOND_WASM=$(find build/js/packages/composeApp/kotlin/ -name "*.wasm" -type f -exec ls -la {} \; | sort -k5 -nr | head -2 | tail -1 | awk '{print $NF}')
        if [ -n "$SECOND_WASM" ] && [ "$SECOND_WASM" != "$LARGEST_WASM" ]; then
          cp -v "$SECOND_WASM" "$PUBLISH_DIR/skiko.wasm"
          echo "Renamed $(basename "$SECOND_WASM") -> skiko.wasm"
        fi
        
        # Create gzipped versions for static WASM files
        echo "Creating gzipped versions..."
        for wasm_file in "$PUBLISH_DIR"/composeApp.wasm "$PUBLISH_DIR"/skiko.wasm; do
          if [ -f "$wasm_file" ]; then
            gzip -9 -c "$wasm_file" > "${wasm_file}.gz"
            echo "Created compressed version: $(basename "${wasm_file}.gz") ($(du -h "${wasm_file}.gz" | cut -f1))"
          fi
        done
        
            # Update references in ALL JavaScript files from hash names to static names
            echo "Updating WASM references in all JS/MJS files..."
            
            # Get the actual hash names from the WASM files
            COMPOSEAPP_HASH=$(echo "$LARGEST_WASM" | sed 's/.*\///')
            SKIKO_HASH=$(echo "$SECOND_WASM" | sed 's/.*\///')
            
            echo "Found hash names: composeApp=$COMPOSEAPP_HASH, skiko=$SKIKO_HASH"
            
            # Validate that we found both files
            if [ -z "$COMPOSEAPP_HASH" ] || [ -z "$SKIKO_HASH" ]; then
              echo "ERROR: Could not determine WASM file hashes!"
              echo "Available WASM files:"
              ls -la build/js/packages/composeApp/kotlin/*.wasm 2>/dev/null || echo "No WASM files found"
              exit 1
            fi
            
            # Validate that the files are different
            if [ "$COMPOSEAPP_HASH" = "$SKIKO_HASH" ]; then
              echo "ERROR: Both WASM files have the same hash: $COMPOSEAPP_HASH"
              exit 1
            fi
            
            # Find all JS and MJS files that might contain WASM references
            JS_FILES=$(find "$PUBLISH_DIR" -name "*.js" -o -name "*.mjs" | head -20)
            
            if [ -z "$JS_FILES" ]; then
              echo "WARNING: No JS/MJS files found in $PUBLISH_DIR"
            else
              echo "Found JS/MJS files to update:"
              echo "$JS_FILES"
              
              # Update references in all found files
              UPDATED_FILES=0
              for js_file in $JS_FILES; do
                if grep -q "$COMPOSEAPP_HASH\|$SKIKO_HASH" "$js_file" 2>/dev/null; then
                  echo "Updating $js_file..."
                  sed -i "s/$COMPOSEAPP_HASH/composeApp.wasm/g" "$js_file"
                  sed -i "s/$SKIKO_HASH/skiko.wasm/g" "$js_file"
                  UPDATED_FILES=$((UPDATED_FILES + 1))
                fi
              done
              
              echo "Updated $UPDATED_FILES files with WASM references"
              
              # Verify the changes
              echo "Verifying changes..."
              REMAINING_HASHES=$(find "$PUBLISH_DIR" -name "*.js" -o -name "*.mjs" -exec grep -l '[a-f0-9]\{20,\}\.wasm' {} \; 2>/dev/null || true)
              
              if [ -n "$REMAINING_HASHES" ]; then
                echo "WARNING: Some files still contain hash-based WASM references:"
                echo "$REMAINING_HASHES"
                echo "This might indicate additional WASM files or different hash patterns."
              else
                echo "✅ All hash-based WASM references successfully replaced with static names"
              fi
            fi
        
            # Copy favicon and other static resources
            echo "Copying favicon and static resources..."
            cp -v composeApp/src/wasmJsMain/resources/favicon*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No favicon files found"
            cp -v composeApp/src/wasmJsMain/resources/apple-touch-icon.png "$PUBLISH_DIR/" 2>/dev/null || echo "No apple-touch-icon found"
            cp -v composeApp/src/wasmJsMain/resources/android-chrome-*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No android-chrome icons found"
            cp -v composeApp/src/wasmJsMain/resources/site.webmanifest "$PUBLISH_DIR/" 2>/dev/null || echo "No webmanifest found"
            
            # Optimize and copy images with compression
            echo "Optimizing images for faster loading..."
            if command -v convert &> /dev/null; then
              # Optimize large PNG images
              for img in butov.png AntonButovMessage.png; do
                if [ -f "composeApp/src/wasmJsMain/resources/$img" ]; then
                  echo "Optimizing $img..."
                  convert "composeApp/src/wasmJsMain/resources/$img" -strip -quality 85 -define png:compression-level=9 "composeApp/src/wasmJsMain/resources/${img%.*}_optimized.png"
                  # Use optimized version if significantly smaller
                  ORIGINAL_SIZE=$(stat -c%s "composeApp/src/wasmJsMain/resources/$img")
                  OPTIMIZED_SIZE=$(stat -c%s "composeApp/src/wasmJsMain/resources/${img%.*}_optimized.png" 2>/dev/null || echo "0")
                  if [ "$OPTIMIZED_SIZE" -gt 0 ] && [ "$OPTIMIZED_SIZE" -lt "$ORIGINAL_SIZE" ]; then
                    mv "composeApp/src/wasmJsMain/resources/${img%.*}_optimized.png" "$PUBLISH_DIR/$img"
                    echo "Optimized $img: $((ORIGINAL_SIZE/1024))KB -> $((OPTIMIZED_SIZE/1024))KB"
                  else
                    cp "composeApp/src/wasmJsMain/resources/$img" "$PUBLISH_DIR/"
                    rm -f "composeApp/src/wasmJsMain/resources/${img%.*}_optimized.png"
                  fi
                fi
              done
            else
              echo "ImageMagick not available, copying images as-is..."
              cp -v composeApp/src/wasmJsMain/resources/*.png "$PUBLISH_DIR/" 2>/dev/null || echo "No PNG images found"
              cp -v composeApp/src/wasmJsMain/resources/*.svg "$PUBLISH_DIR/" 2>/dev/null || echo "No SVG images found"
            fi
        
        # service files
        if [ -f CNAME ]; then
          cp -v CNAME "$PUBLISH_DIR"/
        fi
        touch "$PUBLISH_DIR/.nojekyll"
        
        echo "Final WASM files in publish directory:"
        ls -la "$PUBLISH_DIR"/*.wasm* || echo "No WASM files found"
    - name: Deploy to GitHub Pages
      id: deployment
      uses: peaceiris/actions-gh-pages@v4.0.0
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./composeApp/build/dist/wasmJs/productionExecutable
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'