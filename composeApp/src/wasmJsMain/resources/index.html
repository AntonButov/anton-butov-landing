<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntonButov</title>
    <meta property="og:title" content="Anton Butov – Kotlin Multiplatform Demo" />
    <meta property="og:description" content="My first web application using Kotlin Multiplatform and Compose Multiplatform." />
    <meta property="og:image" content="https://antonbutov.com/preview.png" />
    <meta property="og:url" content="https://antonbutov.com/" />
    
    <!-- Preload critical resources for faster cold start -->
    <link rel="preload" href="composeApp.wasm" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="composeApp.js" as="script">
    <link rel="preload" href="styles.css" as="style">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    
    <link type="text/css" rel="stylesheet" href="styles.css">
    
    <!-- Add loading optimization -->
    <style>
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0B0B0B;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #E20100;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            color: #FFFFFF;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .loading-progress {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #E20100, #FF4444);
            width: 0%;
            transition: width 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Anton Butov...</div>
        <div class="loading-progress">
            <div class="loading-progress-bar" id="progressBar"></div>
        </div>
    </div>
    
    <!-- Loading progress simulation and app initialization -->
    <script>
        let progress = 0;
        let progressInterval = null;
        let isAppReady = false;
        
        const progressBar = document.getElementById('progressBar');
        
        // Start progress simulation
        function startProgressSimulation() {
            progressInterval = setInterval(() => {
                if (!isAppReady) {
                    progress += Math.random() * 10;
                    if (progress > 85) progress = 85; // Don't go to 100% until app is ready
                    progressBar.style.width = progress + '%';
                }
            }, 150);
        }
        
        // Function to hide loading screen (called from Kotlin app)
        window.hideLoadingScreen = function() {
            isAppReady = true;
            
            // Clear progress interval
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            
            // Complete progress bar
            progressBar.style.width = '100%';
            
            // Hide loading screen after a short delay
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        if (loading.parentNode) {
                            loading.remove();
                        }
                    }, 300);
                }
            }, 300);
        };
        
        // Start progress simulation immediately
        startProgressSimulation();
        
        // Register Service Worker for caching (only once)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('SW registered: ', registration);
                })
                .catch((registrationError) => {
                    console.log('SW registration failed: ', registrationError);
                });
        }
        
        // Fallback: hide loading screen after 10 seconds if app doesn't call hideLoadingScreen
        setTimeout(() => {
            if (!isAppReady) {
                console.warn('Loading timeout - hiding loading screen');
                window.hideLoadingScreen();
            }
        }, 10000);
    </script>
    
    <script defer src="composeApp.js"></script>
</body>
</html>
