<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntonButov</title>
    <meta property="og:title" content="Anton Butov – Kotlin Multiplatform Demo" />
    <meta property="og:description" content="My first web application using Kotlin Multiplatform and Compose Multiplatform." />
    <meta property="og:image" content="https://antonbutov.com/preview.png" />
    <meta property="og:url" content="https://antonbutov.com/" />
    <link type="text/css" rel="stylesheet" href="styles.css">
    
    <!-- Add loading optimization -->
    <style>
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0B0B0B;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #E20100;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
    </div>
    <script defer src="composeApp.js"></script>
</body>
</html>
