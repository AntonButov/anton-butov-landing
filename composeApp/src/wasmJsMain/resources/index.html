    <!-- Loading indicator -->
    <style>
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0B0B0B;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #E20100;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Load...</span>
    </div>
    
    <script>
        // Performance monitoring
        const startTime = performance.now();
        
        // Register Service Worker for caching with immediate registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(function(registration) {
                    console.log('SW registered: ', registration);
                })
                .catch(function(registrationError) {
                    console.log('SW registration failed: ', registrationError);
                });
        }
        
        // Optimized loading indicator with performance tracking
        let appLoaded = false;
        let composeAppReady = false;
        
        // Hide loading indicator when app is ready
        function hideLoading() {
            if (appLoaded) return;
            appLoaded = true;
            
            const loading = document.getElementById('loading');
            if (loading) {
                const loadTime = performance.now() - startTime;
                console.log(`App loaded in ${loadTime.toFixed(2)}ms`);
                
                // Плавное исчезновение лоадера
                loading.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                loading.style.opacity = '0';
                loading.style.transform = 'scale(0.95)';
                setTimeout(function() {
                    loading.style.display = 'none';
                }, 600);
            }
        }
        
        // Функция для уведомления о готовности Compose приложения
        window.composeAppReady = function() {
            composeAppReady = true;
            console.log('Compose app is ready');
            // Сразу скрываем лоадер когда Compose готов
            hideLoading();
        };
        
        // Fallback timeout - если Compose не уведомил о готовности
        setTimeout(function() {
            if (!composeAppReady) {
                console.log('Fallback: hiding loading after timeout');
                hideLoading();
            }
        }, 5000);
        
        // Preload critical resources
        function preloadResource(href, as) {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.href = href;
            link.as = as;
            if (as === 'script' || as === 'fetch') {
                link.crossOrigin = 'anonymous';
            }
            document.head.appendChild(link);
        }
        
        // Preload vendor chunks
        preloadResource('vendors.js', 'script');
        
        // Core Web Vitals monitoring
        function sendToAnalytics(metric) {
            console.log('Core Web Vital:', metric);
            // Здесь можно добавить отправку в Google Analytics или другую аналитику
            // gtag('event', metric.name, {
            //     value: Math.round(metric.value),
            //     event_category: 'Web Vitals',
            //     event_label: metric.id,
            //     non_interaction: true,
            // });
        }
        
        // LCP (Largest Contentful Paint)
        new PerformanceObserver((entryList) => {
            for (const entry of entryList.getEntries()) {
                sendToAnalytics({
                    name: 'LCP',
                    value: entry.startTime,
                    id: entry.id
                });
            }
        }).observe({entryTypes: ['largest-contentful-paint']});
        
        // FID (First Input Delay)
        new PerformanceObserver((entryList) => {
            for (const entry of entryList.getEntries()) {
                sendToAnalytics({
                    name: 'FID',
                    value: entry.processingStart - entry.startTime,
                    id: entry.id
                });
            }
        }).observe({entryTypes: ['first-input']});
        
        // CLS (Cumulative Layout Shift)
        let clsValue = 0;
        new PerformanceObserver((entryList) => {
            for (const entry of entryList.getEntries()) {
                if (!entry.hadRecentInput) {
                    clsValue += entry.value;
                }
            }
            sendToAnalytics({
                name: 'CLS',
                value: clsValue,
                id: 'cls-observer'
            });
        }).observe({entryTypes: ['layout-shift']});
        
        // FCP (First Contentful Paint)
        new PerformanceObserver((entryList) => {
            for (const entry of entryList.getEntries()) {
                sendToAnalytics({
                    name: 'FCP',
                    value: entry.startTime,
                    id: entry.id
                });
            }
        }).observe({entryTypes: ['paint']});
        
        // TTFB (Time to First Byte)
        new PerformanceObserver((entryList) => {
            for (const entry of entryList.getEntries()) {
                if (entry.responseStart > 0) {
                    sendToAnalytics({
                        name: 'TTFB',
                        value: entry.responseStart - entry.requestStart,
                        id: entry.id
                    });
                }
            }
        }).observe({entryTypes: ['navigation']});
    </script>
    
    <script type="application/javascript" src="composeApp.js"></script>
</body>
