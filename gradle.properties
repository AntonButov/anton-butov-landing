#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M -XX:+UseG1GC -XX:+UseStringDeduplication
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.build.report.enable=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true

#Wasm оптимизации
kotlin.wasm.experimental.fast-math=true
kotlin.wasm.experimental.optimize-for-size=true